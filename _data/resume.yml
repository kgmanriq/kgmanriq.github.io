name: Katrina Gacusan Manrique, MPP, PMP
website: kgmanriq.com

overview:
  - >-
    Katrina Manrique is a strategy consultant with a decade of experience helping public interest and
    capital-intensive organizations safely design, adopt, and manage complex technology systems. She has
    worked across six industries within the last three years including state and local government, public
    transit, power and utilities, port authorities, and higher education institutions.
  - >-
    She has contributed to first-of-their-kind solutions at significant scale, including a $1B statewide
    Salesforce implementation and California's first predictive analytics tool mapping climate impacts
    against social vulnerability. Prior work at the Los Angeles County Board of Supervisors, San Francisco
    Board of Supervisors, California Governor's Office of Land Use and Innovation, and California's
    Behavioral Health Services Oversight and Accountability Commission grounds her understanding of how
    public servants adopt and use technology.

highlights:
  - label: System Requirements
    text: >-
      Defined the business requirements guiding configuration of a $1B software platform and assessed 70+
      external systems for integration. Identified 65+ use cases for AI adoption in back-office operations.
  - label: Stakeholder Engagement and User Testing
    text: >-
      Conducted 300+ interviews and working sessions with public servants across 50+ California counties,
      including 100+ rural and tribal stakeholders, to inform system design.
  - label: Data and Analytics
    text: >-
      Built 20+ data dashboards for eight behavioral health clinics, increasing utilization and productivity
      by 50 percent. Established a data governance program at a state transportation agency to strengthen
      quality and reliability of workforce data tied to recruitment, retention, and hiring.
  - label: Process Improvement
    text: >-
      Identified 35 process improvements across four county departments, drawing on stakeholder interviews
      and benchmarking against 20 peer counties. Designed the first project management office within a state
      transportation agency, overseeing more than $60M in clean energy initiatives.

