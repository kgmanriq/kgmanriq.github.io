---
layout: default
---
<article class="post">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  <div class="prose">
    {{ content }}
  </div>
</article>
