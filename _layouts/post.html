---
layout: default
---
<article class="prose">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="subtitle">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  {% if page.image %}<img class="post-hero" src="{{ page.image | relative_url }}" alt="">{% endif %}
  {{ content }}
</article>
