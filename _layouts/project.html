---
layout: default
---
<article class="prose">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="subtitle">{% if page.type %}{{ page.type }} · {% endif %}{{ page.date | date: "%B %Y" }}</p>
  </header>
  {% if page.image %}<img class="post-hero" src="{{ page.image | relative_url }}" alt="">{% endif %}
  {{ content }}
</article>
